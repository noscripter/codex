<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980">
<rect x="0" y="0" width="1760" height="980" fill="#f8fafc" />
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8" />
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
  </filter>
</defs>
<g filter="url(#shadow)">
<rect x="32" y="28" width="1696" height="924" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
</g>
<text x="64" y="78" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">codex-rs main interactive workflow</text>
<text x="64" y="114" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">From `codex` command entry to thread startup, turn execution, notifications, persistence, and final output.</text>
<rect x="80" y="210" width="250" height="118" rx="20" ry="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
<text x="98" y="244" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">1. User prompt</text>
<text x="98" y="276" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="98" dy="0">Prompt, images, cwd, and</tspan><tspan x="98" dy="20.7">mode selection enter</tspan><tspan x="98" dy="20.7">through the codex</tspan><tspan x="98" dy="20.7">command.</tspan></text>
<rect x="365" y="210" width="250" height="118" rx="20" ry="20" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5" />
<text x="383" y="244" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">2. codex CLI</text>
<text x="383" y="276" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="383" dy="0">cli/src/main.rs parses</tspan><tspan x="383" dy="20.7">flags and chooses TUI,</tspan><tspan x="383" dy="20.7">exec, app-server, or</tspan><tspan x="383" dy="20.7">mcp-server.</tspan></text>
<rect x="650" y="210" width="250" height="118" rx="20" ry="20" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5" />
<text x="668" y="244" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">3. TUI bootstrap</text>
<text x="668" y="276" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="668" dy="0">codex_tui::run_main loads</tspan><tspan x="668" dy="20.7">config, runs</tspan><tspan x="668" dy="20.7">onboarding/trust checks,</tspan><tspan x="668" dy="20.7">and starts an embedded or</tspan><tspan x="668" dy="20.7">remote app-server</tspan><tspan x="668" dy="20.7">session.</tspan></text>
<rect x="935" y="210" width="250" height="118" rx="20" ry="20" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
<text x="953" y="244" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">4. App server</text>
<text x="953" y="276" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="953" dy="0">bootstrap requests load</tspan><tspan x="953" dy="20.7">account + model catalog,</tspan><tspan x="953" dy="20.7">then thread/start or</tspan><tspan x="953" dy="20.7">resume/fork establishes</tspan><tspan x="953" dy="20.7">the thread.</tspan></text>
<rect x="1220" y="210" width="250" height="118" rx="20" ry="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
<text x="1238" y="244" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">5. Core runtime</text>
<text x="1238" y="276" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1238" dy="0">turn/start becomes core</tspan><tspan x="1238" dy="20.7">ops, a Session spawns</tspan><tspan x="1238" dy="20.7">RegularTask, and run_turn</tspan><tspan x="1238" dy="20.7">builds prompt + tools for</tspan><tspan x="1238" dy="20.7">each sampling round.</tspan></text>
<rect x="1505" y="210" width="250" height="118" rx="20" ry="20" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5" />
<text x="1523" y="244" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">6. Model + tools</text>
<text x="1523" y="276" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1523" dy="0">The provider streams</tspan><tspan x="1523" dy="20.7">assistant items or tool</tspan><tspan x="1523" dy="20.7">calls; tools may branch</tspan><tspan x="1523" dy="20.7">into approvals, sandboxed</tspan><tspan x="1523" dy="20.7">execution, patches, MCP,</tspan><tspan x="1523" dy="20.7">apps, or sub-agents.</tspan></text>
<polyline points="330,269.0 365,269.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="615,269.0 650,269.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="900,269.0 935,269.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1185,269.0 1220,269.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1470,269.0 1505,269.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="110" y="410" width="540" height="180" rx="20" ry="20" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
<text x="128" y="444" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">7. Notifications stream back</text>
<text x="128" y="476" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="128" dy="0">item/started, item/.../delta, item/completed,</tspan><tspan x="128" dy="23.459999999999997">turn/started, turn/completed, warnings, approval</tspan><tspan x="128" dy="23.459999999999997">requests, and status notifications flow back through</tspan><tspan x="128" dy="23.459999999999997">the app-server adapter and update the TUI state in</tspan><tspan x="128" dy="23.459999999999997">real time.</tspan></text>
<rect x="760" y="410" width="510" height="180" rx="20" ry="20" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5" />
<text x="778" y="444" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">8. Persistence and resumability</text>
<text x="778" y="476" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="778" dy="0">Each turn writes rollout JSONL records, while</tspan><tspan x="778" dy="23.459999999999997">codex-state maintains SQLite metadata so</tspan><tspan x="778" dy="23.459999999999997">thread/list, read, archive, and resume can stay</tspan><tspan x="778" dy="23.459999999999997">fast without losing the append-only source</tspan><tspan x="778" dy="23.459999999999997">transcript.</tspan></text>
<rect x="1360" y="410" width="260" height="180" rx="20" ry="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
<text x="1378" y="444" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">9. Final output</text>
<text x="1378" y="476" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1378" dy="0">The user sees rendered</tspan><tspan x="1378" dy="23.459999999999997">assistant text, diffs,</tspan><tspan x="1378" dy="23.459999999999997">approvals, status,</tspan><tspan x="1378" dy="23.459999999999997">token usage, and a</tspan><tspan x="1378" dy="23.459999999999997">resumable thread</tspan><tspan x="1378" dy="23.459999999999997">id/name.</tspan></text>
<polyline points="1630,268 1630,360 380,360 380,410" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1630,268 1630,360 1015,360 1015,410" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="380,590 380,690 1490,690 1490,590" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="110" y="690" width="610" height="220" rx="20" ry="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
<text x="128" y="724" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Turn loop details</text>
<text x="128" y="756" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start"><tspan x="128" dy="0">Inside one turn, core may perform multiple model</tspan><tspan x="128" dy="24.839999999999996">sampling rounds. Tool outputs, extra pending input, hook</tspan><tspan x="128" dy="24.839999999999996">continuations, compaction, or interruptions can all</tspan><tspan x="128" dy="24.839999999999996">cause another internal request before the turn finally</tspan><tspan x="128" dy="24.839999999999996">completes.</tspan></text>
<rect x="810" y="690" width="560" height="220" rx="20" ry="20" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5" />
<text x="828" y="724" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Embedded versus remote app-server</text>
<text x="828" y="756" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start"><tspan x="828" dy="0">TUI usually starts an in-process app-server through</tspan><tspan x="828" dy="24.839999999999996">codex-app-server-client, but the same UI contract</tspan><tspan x="828" dy="24.839999999999996">can target a remote websocket app-server. That</tspan><tspan x="828" dy="24.839999999999996">keeps local and remote behavior aligned around the</tspan><tspan x="828" dy="24.839999999999996">same thread/turn API.</tspan></text>
<rect x="1420" y="690" width="210" height="220" rx="20" ry="20" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5" />
<text x="1438" y="724" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Related surfaces</text>
<text x="1438" y="756" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1438" dy="0">codex-exec follows</tspan><tspan x="1438" dy="22.08">the same app-server</tspan><tspan x="1438" dy="22.08">path without the</tspan><tspan x="1438" dy="22.08">fullscreen TUI.</tspan><tspan x="1438" dy="22.08">mcp-server turns</tspan><tspan x="1438" dy="22.08">Codex itself into a</tspan><tspan x="1438" dy="22.08">tool for other MCP</tspan><tspan x="1438" dy="22.08">clients.</tspan></text>
</svg>
