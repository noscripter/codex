<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect x="0" y="0" width="1600" height="1100" fill="#f8fafc" />
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8" />
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
  </filter>
</defs>
<g filter="url(#shadow)">
<rect x="32" y="28" width="1536" height="1044" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
</g>
<text x="64" y="78" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">codex-rs turn execution loop</text>
<text x="64" y="114" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">How a regular core turn prepares context, streams model output, runs tools, and decides whether another sampling round is needed.</text>
<rect x="120" y="170" width="360" height="110" rx="20" ry="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
<text x="138" y="204" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Start turn</text>
<text x="138" y="236" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="138" dy="0">RegularTask emits TurnStarted and</tspan><tspan x="138" dy="22.08">checks whether there is initial or</tspan><tspan x="138" dy="22.08">pending input to consume.</tspan></text>
<rect x="120" y="320" width="360" height="120" rx="20" ry="20" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5" />
<text x="138" y="354" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Prepare context</text>
<text x="138" y="386" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="138" dy="0">Run pre-sampling compact if needed,</tspan><tspan x="138" dy="22.08">record turn context updates, and</tspan><tspan x="138" dy="22.08">establish the history reference</tspan><tspan x="138" dy="22.08">point for the sampling round.</tspan></text>
<rect x="120" y="485" width="360" height="150" rx="20" ry="20" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5" />
<text x="138" y="519" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Collect runtime capabilities</text>
<text x="138" y="551" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="138" dy="0">Load skill injections, plugin</tspan><tspan x="138" dy="22.08">mentions, MCP tool inventory,</tspan><tspan x="138" dy="22.08">connector/app visibility, dynamic</tspan><tspan x="138" dy="22.08">tools, and collaboration-mode</tspan><tspan x="138" dy="22.08">instructions for this turn.</tspan></text>
<rect x="120" y="675" width="360" height="120" rx="20" ry="20" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
<text x="138" y="709" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Build prompt + ToolRouter</text>
<text x="138" y="741" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="138" dy="0">Prompt = history + instructions +</tspan><tspan x="138" dy="22.08">model settings + current tool specs.</tspan><tspan x="138" dy="22.08">ToolRouter decides what tools the</tspan><tspan x="138" dy="22.08">model can call this round.</tspan></text>
<rect x="120" y="835" width="360" height="120" rx="20" ry="20" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5" />
<text x="138" y="869" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Run sampling request</text>
<text x="138" y="901" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="138" dy="0">ModelClient streams Responses</tspan><tspan x="138" dy="22.08">events. Core converts them into item</tspan><tspan x="138" dy="22.08">starts, deltas, completions,</tspan><tspan x="138" dy="22.08">warnings, and tool futures.</tspan></text>
<line x1="300" y1="280" x2="300" y2="320" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
<line x1="300" y1="440" x2="300" y2="485" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
<line x1="300" y1="635" x2="300" y2="675" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
<line x1="300" y1="795" x2="300" y2="835" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
<polygon points="790,220.0 920.0,280 790,340.0 660.0,280" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
<text x="790" y="270" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0">Tool call</text>
<text x="790" y="302" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0">present?</text>
<polygon points="790,450.0 940.0,520 790,590.0 640.0,520" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5" />
<text x="790" y="505" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0">Need approval</text>
<text x="790" y="538" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0">or policy change?</text>
<rect x="1090" y="200" width="420" height="140" rx="20" ry="20" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
<text x="1108" y="234" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Assistant-only path</text>
<text x="1108" y="266" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1108" dy="0">Record assistant / reasoning items, update</tspan><tspan x="1108" dy="22.08">token usage, and keep any streamed deltas</tspan><tspan x="1108" dy="22.08">visible to the client.</tspan></text>
<rect x="1090" y="420" width="420" height="170" rx="20" ry="20" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5" />
<text x="1108" y="454" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Tool execution path</text>
<text x="1108" y="486" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1108" dy="0">Orchestrator applies approvals, chooses</tspan><tspan x="1108" dy="22.08">sandbox mode, runs shell / patch / MCP /</tspan><tspan x="1108" dy="22.08">app / dynamic / multi-agent tools, then</tspan><tspan x="1108" dy="22.08">records outputs as pending input for a</tspan><tspan x="1108" dy="22.08">follow-up sampling round.</tspan></text>
<rect x="1090" y="675" width="420" height="130" rx="20" ry="20" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5" />
<text x="1108" y="709" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Post-round checks</text>
<text x="1108" y="741" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1108" dy="0">Inspect pending input, stop hooks,</tspan><tspan x="1108" dy="22.08">interrupts, errors, and auto-compact</tspan><tspan x="1108" dy="22.08">thresholds before deciding whether another</tspan><tspan x="1108" dy="22.08">round is needed.</tspan></text>
<polygon points="790,690.0 940.0,760 790,830.0 640.0,760" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5" />
<text x="790" y="745" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0">More pending input</text>
<text x="790" y="778" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0">or follow-up work?</text>
<rect x="1090" y="870" width="420" height="120" rx="20" ry="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
<text x="1108" y="904" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Turn completes</text>
<text x="1108" y="936" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1108" dy="0">Emit TurnComplete, clear active turn</tspan><tspan x="1108" dy="22.08">state, persist rollout items, and allow</tspan><tspan x="1108" dy="22.08">the scheduler to start the next queued</tspan><tspan x="1108" dy="22.08">turn if one exists.</tspan></text>
<polyline points="480,895 610,895 610,280 660,280" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="920,280 1090,280" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="790,340 790,450" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="920,520 1090,520" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1300,590 1300,740 940,740" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1300,340 1300,740 940,740" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="790,590 790,675" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="920,760 1090,760" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="790,830 790,895 1090,930" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="640,760 300,760 300,835" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="989.0" y="242" width="62" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="1020" y="261" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">no</text>
<rect x="939.0" y="482" width="62" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="970" y="501" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">yes</text>
<rect x="989.0" y="722" width="62" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="1020" y="741" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">no</text>
<rect x="398.4" y="722" width="143.20000000000002" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="470" y="741" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">yes -&amp;gt; loop</text>
<text x="100" y="1010" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start"><tspan x="100" dy="0">Key idea: one user-visible turn may contain multiple internal model requests. The loop ends only when there is no pending input, no required</tspan><tspan x="100" dy="24.3">follow-up, and no stop-hook continuation blocking completion.</tspan></text>
</svg>
