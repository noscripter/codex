<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
<rect x="0" y="0" width="1760" height="1080" fill="#f8fafc" />
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8" />
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
  </filter>
</defs>
<g filter="url(#shadow)">
<rect x="32" y="28" width="1696" height="1024" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
</g>
<text x="64" y="78" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">codex-rs feature map</text>
<text x="64" y="114" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">Major surfaces, runtime layers, safety systems, extension points, and storage/telemetry responsibilities.</text>
<rect x="70" y="150" width="360" height="220" rx="20" ry="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
<text x="88" y="184" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">User-facing surfaces</text>
<text x="88" y="216" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="88" dy="0">• codex (multitool CLI)</tspan><tspan x="88" dy="23.459999999999997">• codex-tui (interactive TUI)</tspan><tspan x="88" dy="23.459999999999997">• codex-exec (headless automation)</tspan><tspan x="88" dy="23.459999999999997">• codex app-server (JSON-RPC</tspan><tspan x="88" dy="23.459999999999997">  server)</tspan><tspan x="88" dy="23.459999999999997">• codex mcp-server (Codex as an</tspan><tspan x="88" dy="23.459999999999997">  MCP tool)</tspan></text>
<rect x="470" y="150" width="360" height="220" rx="20" ry="20" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5" />
<text x="488" y="184" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Control plane</text>
<text x="488" y="216" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="488" dy="0">• codex-app-server-client unifies</tspan><tspan x="488" dy="23.459999999999997">  in-process and remote clients</tspan><tspan x="488" dy="23.459999999999997">• codex-app-server exposes thread</tspan><tspan x="488" dy="23.459999999999997">  / turn / item APIs</tspan><tspan x="488" dy="23.459999999999997">• app-server-protocol defines</tspan><tspan x="488" dy="23.459999999999997">  JSON-RPC v2 contracts</tspan><tspan x="488" dy="23.459999999999997">• protocol keeps the legacy Op /</tspan><tspan x="488" dy="23.459999999999997">  Event core types</tspan></text>
<rect x="870" y="150" width="360" height="220" rx="20" ry="20" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
<text x="888" y="184" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Core runtime</text>
<text x="888" y="216" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="888" dy="0">• ThreadManager owns live threads</tspan><tspan x="888" dy="23.459999999999997">• CodexThread wraps a session</tspan><tspan x="888" dy="23.459999999999997">  handle</tspan><tspan x="888" dy="23.459999999999997">• Session manages turn state,</tspan><tspan x="888" dy="23.459999999999997">  mailbox, tools, history, hooks</tspan><tspan x="888" dy="23.459999999999997">• tasks::RegularTask drives the</tspan><tspan x="888" dy="23.459999999999997">  normal run_turn loop</tspan></text>
<rect x="1270" y="150" width="400" height="220" rx="20" ry="20" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5" />
<text x="1288" y="184" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Providers and transports</text>
<text x="1288" y="216" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1288" dy="0">• codex-api builds typed Responses /</tspan><tspan x="1288" dy="23.459999999999997">  Compact / Memories requests</tspan><tspan x="1288" dy="23.459999999999997">• codex-client owns HTTP/SSE/WebSocket</tspan><tspan x="1288" dy="23.459999999999997">  transport details</tspan><tspan x="1288" dy="23.459999999999997">• login + models-manager select</tspan><tspan x="1288" dy="23.459999999999997">  OpenAI, ChatGPT, LM Studio, or</tspan><tspan x="1288" dy="23.459999999999997">  Ollama</tspan></text>
<rect x="70" y="420" width="520" height="230" rx="20" ry="20" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5" />
<text x="88" y="454" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Extensibility features</text>
<text x="88" y="486" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="88" dy="0">• skills and core-skills inject task-specific</tspan><tspan x="88" dy="23.459999999999997">  instructions</tspan><tspan x="88" dy="23.459999999999997">• plugins add packaged skills, apps, MCP servers,</tspan><tspan x="88" dy="23.459999999999997">  and marketplace metadata</tspan><tspan x="88" dy="23.459999999999997">• MCP client support loads</tspan><tspan x="88" dy="23.459999999999997">  tools/resources/templates from external servers</tspan><tspan x="88" dy="23.459999999999997">• dynamic tools and multi-agent tools extend the</tspan><tspan x="88" dy="23.459999999999997">  model-visible tool set at runtime</tspan></text>
<rect x="640" y="420" width="520" height="230" rx="20" ry="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
<text x="658" y="454" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Execution and safety features</text>
<text x="658" y="486" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="658" dy="0">• approval policies decide when the user (or</tspan><tspan x="658" dy="23.459999999999997">  guardian) must approve tool actions</tspan><tspan x="658" dy="23.459999999999997">• sandboxing selects read-only / workspace-write /</tspan><tspan x="658" dy="23.459999999999997">  danger-full-access enforcement</tspan><tspan x="658" dy="23.459999999999997">• execpolicy and shell-escalation shape command</tspan><tspan x="658" dy="23.459999999999997">  execution</tspan><tspan x="658" dy="23.459999999999997">• network-proxy applies domain and socket policies</tspan></text>
<rect x="1210" y="420" width="460" height="230" rx="20" ry="20" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5" />
<text x="1228" y="454" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Persistence and observability</text>
<text x="1228" y="486" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1228" dy="0">• rollout JSONL files under</tspan><tspan x="1228" dy="23.459999999999997">  ~/.codex/sessions keep the source-of-truth</tspan><tspan x="1228" dy="23.459999999999997">  transcript</tspan><tspan x="1228" dy="23.459999999999997">• codex-state mirrors searchable metadata</tspan><tspan x="1228" dy="23.459999999999997">  into SQLite</tspan><tspan x="1228" dy="23.459999999999997">• otel, analytics, and feedback crates emit</tspan><tspan x="1228" dy="23.459999999999997">  logs, traces, metrics, and support bundles</tspan></text>
<rect x="290" y="700" width="1140" height="250" rx="20" ry="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
<text x="308" y="734" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Main end-to-end path</text>
<text x="308" y="766" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start"><tspan x="308" dy="0">Surface -&gt; app-server client / transport -&gt; app-server message processor -&gt; ThreadManager -&gt; Session</tspan><tspan x="308" dy="26.22">task -&gt; ModelClient -&gt; provider stream. During the turn, ToolRouter and the orchestrator can branch</tspan><tspan x="308" dy="26.22">into approvals, sandbox selection, command execution, patch application, MCP calls, app tools, or</tspan><tspan x="308" dy="26.22">multi-agent fan-out before their outputs are fed back into the next model sampling round.</tspan></text>
<polyline points="430,260 470,260" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="830,260 870,260" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1230,260 1270,260" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1030,370 1030,700" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="330,650 520,700" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="900,650 850,700" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1450,650 1240,700" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="316.79999999999995" y="718" width="266.40000000000003" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="450" y="737" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">shared API / client contract</text>
<rect x="884.4" y="718" width="231.20000000000002" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="1000" y="737" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">session + turn execution</text>
<rect x="1280.8" y="718" width="178.4" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="1370" y="737" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">provider streaming</text>
<text x="850" y="1000" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">Thread = conversation boundary   •   Turn = one user-driven execution cycle   •   Item = persisted unit of input or output</text>
</svg>
