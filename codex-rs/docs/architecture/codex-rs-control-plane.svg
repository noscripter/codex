  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8" />
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
  </filter>
</defs>
<g filter="url(#shadow)">
<rect x="32" y="28" width="1736" height="1024" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
</g>
<text x="64" y="78" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">codex-rs control plane and runtime layering</text>
<text x="64" y="114" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">How TUI, exec, remote clients, app-server, and codex-core align around the same thread/turn model.</text>
<rect x="70" y="160" width="420" height="860" rx="28" ry="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="280.0" y="196" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0">Surfaces</text>
<line x1="94" y1="212" x2="466" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
<rect x="550" y="160" width="420" height="860" rx="28" ry="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="760.0" y="196" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0">Shared control plane</text>
<line x1="574" y1="212" x2="946" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
<rect x="1030" y="160" width="360" height="860" rx="28" ry="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="1210.0" y="196" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0">Core runtime</text>
<line x1="1054" y1="212" x2="1366" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
<rect x="1450" y="160" width="280" height="860" rx="28" ry="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
<text x="1590.0" y="196" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0">Providers / state</text>
<line x1="1474" y1="212" x2="1706" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
<rect x="105" y="220" width="350" height="140" rx="20" ry="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
<text x="123" y="254" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">codex-tui</text>
<text x="123" y="286" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="123" dy="0">Interactive fullscreen UI. Uses</tspan><tspan x="123" dy="22.08">AppServerSession and the app-server</tspan><tspan x="123" dy="22.08">adapter to drive a thread and</tspan><tspan x="123" dy="22.08">render live notifications.</tspan></text>
<rect x="105" y="390" width="350" height="140" rx="20" ry="20" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5" />
<text x="123" y="424" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">codex-exec</text>
<text x="123" y="456" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="123" dy="0">Headless automation surface. Starts</tspan><tspan x="123" dy="22.08">an in-process app-server client and</tspan><tspan x="123" dy="22.08">renders either human text or JSONL</tspan><tspan x="123" dy="22.08">events.</tspan></text>
<rect x="105" y="560" width="350" height="160" rx="20" ry="20" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5" />
<text x="123" y="594" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Remote clients</text>
<text x="123" y="626" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="123" dy="0">VS Code, websocket integrations,</tspan><tspan x="123" dy="22.08">app-server test clients, and other</tspan><tspan x="123" dy="22.08">tooling connect through the same</tspan><tspan x="123" dy="22.08">thread / turn / item contract.</tspan></text>
<rect x="105" y="750" width="350" height="180" rx="20" ry="20" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5" />
<text x="123" y="784" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">mcp-server consumers</text>
<text x="123" y="816" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="123" dy="0">Other MCP clients can run Codex</tspan><tspan x="123" dy="22.08">itself as a tool server;</tspan><tspan x="123" dy="22.08">internally, that still converges on</tspan><tspan x="123" dy="22.08">the same core engine concepts.</tspan></text>
<rect x="585" y="230" width="350" height="130" rx="20" ry="20" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
<text x="603" y="264" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">codex-app-server-client</text>
<text x="603" y="296" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="603" dy="0">TUI and exec use the same facade</tspan><tspan x="603" dy="22.08">for in-process startup, typed</tspan><tspan x="603" dy="22.08">requests, notifications, and</tspan><tspan x="603" dy="22.08">bounded shutdown.</tspan></text>
<rect x="585" y="400" width="350" height="180" rx="20" ry="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
<text x="603" y="434" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">codex-app-server</text>
<text x="603" y="466" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="603" dy="0">Transport + routing layer. Handles</tspan><tspan x="603" dy="22.08">initialize, thread/start,</tspan><tspan x="603" dy="22.08">turn/start, approvals, config APIs,</tspan><tspan x="603" dy="22.08">FS APIs, and connection/session</tspan><tspan x="603" dy="22.08">state.</tspan></text>
<rect x="585" y="630" width="350" height="170" rx="20" ry="20" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5" />
<text x="603" y="664" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">MessageProcessor stack</text>
<text x="603" y="696" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="603" dy="0">MessageProcessor wires</tspan><tspan x="603" dy="22.08">auth/config/fs helpers.</tspan><tspan x="603" dy="22.08">CodexMessageProcessor converts</tspan><tspan x="603" dy="22.08">app-server requests into core</tspan><tspan x="603" dy="22.08">thread and turn operations.</tspan></text>
<rect x="585" y="840" width="350" height="130" rx="20" ry="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
<text x="603" y="874" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Thread watch + bespoke event handling</text>
<text x="603" y="906" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="603" dy="0">Live core events are rewritten into</tspan><tspan x="603" dy="22.08">app-server thread/turn/item</tspan><tspan x="603" dy="22.08">notifications and request/response</tspan><tspan x="603" dy="22.08">flows.</tspan></text>
<rect x="1065" y="260" width="290" height="150" rx="20" ry="20" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
<text x="1083" y="294" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">ThreadManager</text>
<text x="1083" y="326" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1083" dy="0">Owns live thread registry,</tspan><tspan x="1083" dy="22.08">spawning, resume/fork logic,</tspan><tspan x="1083" dy="22.08">watchers, and thread</tspan><tspan x="1083" dy="22.08">lifecycle.</tspan></text>
<rect x="1065" y="450" width="290" height="170" rx="20" ry="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
<text x="1083" y="484" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">CodexThread + Session</text>
<text x="1083" y="516" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1083" dy="0">Submission queue, event</tspan><tspan x="1083" dy="22.08">queue, active turn state,</tspan><tspan x="1083" dy="22.08">mailbox, hooks, history, MCP</tspan><tspan x="1083" dy="22.08">manager, plugins, and task</tspan><tspan x="1083" dy="22.08">scheduling.</tspan></text>
<rect x="1065" y="670" width="290" height="180" rx="20" ry="20" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5" />
<text x="1083" y="704" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Tasks + tool orchestration</text>
<text x="1083" y="736" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1083" dy="0">RegularTask / review /</tspan><tspan x="1083" dy="22.08">compact / user_shell call</tspan><tspan x="1083" dy="22.08">run_turn, build the prompt,</tspan><tspan x="1083" dy="22.08">and broker tool execution</tspan><tspan x="1083" dy="22.08">with approval and sandbox</tspan><tspan x="1083" dy="22.08">policies.</tspan></text>
<rect x="1485" y="260" width="210" height="140" rx="20" ry="20" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5" />
<text x="1503" y="294" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Model providers</text>
<text x="1503" y="326" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1503" dy="0">OpenAI / ChatGPT /</tspan><tspan x="1503" dy="22.08">LM Studio / Ollama</tspan><tspan x="1503" dy="22.08">via codex-api +</tspan><tspan x="1503" dy="22.08">codex-client.</tspan></text>
<rect x="1485" y="470" width="210" height="160" rx="20" ry="20" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5" />
<text x="1503" y="504" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Persistence</text>
<text x="1503" y="536" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1503" dy="0">Rollout JSONL</tspan><tspan x="1503" dy="22.08">sessions +</tspan><tspan x="1503" dy="22.08">codex-state SQLite</tspan><tspan x="1503" dy="22.08">metadata and logs.</tspan></text>
<rect x="1485" y="700" width="210" height="180" rx="20" ry="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
<text x="1503" y="734" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">Policy + telemetry</text>
<text x="1503" y="766" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1503" dy="0">login,</tspan><tspan x="1503" dy="22.08">models-manager,</tspan><tspan x="1503" dy="22.08">sandboxing,</tspan><tspan x="1503" dy="22.08">execpolicy,</tspan><tspan x="1503" dy="22.08">network-proxy,</tspan><tspan x="1503" dy="22.08">otel, analytics,</tspan><tspan x="1503" dy="22.08">feedback.</tspan></text>
<polyline points="455,290 585,290" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="455,460 585,460" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="455,640 585,640" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="455,840 585,840" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="430.8" y="249" width="178.4" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="520" y="268" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">embedded or remote</text>
<polyline points="935,295 1065,335" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="935,490 1065,535" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="935,715 1065,535" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="935,905 1065,760" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1355,335 1485,330" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1355,535 1485,550" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1355,760 1485,790" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<polyline points="1485,550 1425,550 1425,535 1355,535" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 8" />
<polyline points="1485,790 1425,790 1425,760 1355,760" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 8" />
<rect x="1325.2" y="502" width="169.60000000000002" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="1410" y="521" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">events / metadata</text>
<rect x="1342.8" y="718" width="134.4" height="34" rx="14" ry="14" fill="#f8fafc" stroke="none" stroke-width="0" />
<text x="1410" y="737" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0">policy inputs</text>
<text x="120" y="980" font-family="Inter, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start"><tspan x="120" dy="0">Why this layering matters: local TUI, local exec, and remote integrations all converge on the app-server contract. That lets Codex share one thread/turn</tspan><tspan x="120" dy="24.3">model across transports while still keeping the heavy runtime logic in codex-core.</tspan></text>
</svg>
